[package]
name = "linuxdrop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Native nearby sharing for Linux"

[dependencies]
linuxdrop-ipc = { path = "../../crates/linuxdrop-ipc" }
linuxdrop-core = { path = "../../crates/linuxdrop-core" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
serde_json = "1"
libc = "0.2"
