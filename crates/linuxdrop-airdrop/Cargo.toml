[package]
name = "linuxdrop-airdrop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
linuxdrop-core = { path = "../linuxdrop-core" }
linuxdrop-network = { path = "../linuxdrop-network" }
linuxdrop-storage = { path = "../linuxdrop-storage" }
luftlift-rs = { path = "../../vendor/opendrop-rs/crates/luftlift-rs" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
tempfile = "3"
flate2 = "1"
plist = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
mdns-sd = "0.11"
bluer = { version = "0.17", features = ["bluetoothd"] }

[dev-dependencies]
zbus.workspace = true

[features]
fuzzing = []
