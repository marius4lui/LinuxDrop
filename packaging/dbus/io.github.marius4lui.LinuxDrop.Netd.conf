<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="linuxdrop-netd">
    <allow send_destination="fi.w1.wpa_supplicant1" send_interface="fi.w1.wpa_supplicant1" send_member="GetInterface"/>
    <allow send_destination="fi.w1.wpa_supplicant1" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="fi.w1.wpa_supplicant1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="fi.w1.wpa_supplicant1" send_interface="fi.w1.wpa_supplicant1.Interface.P2PDevice"/>
    <allow receive_sender="fi.w1.wpa_supplicant1"/>
  </policy>
</busconfig>
